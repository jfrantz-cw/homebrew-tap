name: Sync formula

# Pull-based on purpose. Overmind pushing here would need a cross-repo
# credential; this repo updating itself needs only the built-in GITHUB_TOKEN,
# so the tap holds no long-lived secret.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: sync-formula
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Resolve the latest overmind release
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REPO: jfrantz-cw/overmind
        run: |
          # This token can read public repos only. While overmind is private the
          # lookup fails, so warn and skip instead of failing hourly; the sync
          # starts working on its own once overmind is public.
          if ! tag="$(gh release view --repo "$SOURCE_REPO" --json tagName --jq .tagName 2>/dev/null)"; then
            echo "::warning::no readable release in $SOURCE_REPO (still private?); skipping"
            echo "skip=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          echo "tag=$tag" >>"$GITHUB_OUTPUT"

      # Deliberately the default branch, not the release tag: the generator is a
      # tool, and pinning it to the tag it renders would mean any release older
      # than the tool (v1.0.0 is) has no generator to run.
      - name: Check out the generator
        if: steps.rel.outputs.skip != 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: jfrantz-cw/overmind
          path: .source
          persist-credentials: false

      - name: Regenerate the formula
        if: steps.rel.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.rel.outputs.tag }}
        run: .source/scripts/update-homebrew-formula.sh "$TAG" Formula/ovm.rb

      - name: Commit when the formula moved
        if: steps.rel.outputs.skip != 'true'
        env:
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          rm -rf .source
          if git diff --quiet -- Formula/ovm.rb; then
            echo "formula already at $TAG"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add Formula/ovm.rb
          git commit -m "chore: sync ovm formula to $TAG"
          git push
